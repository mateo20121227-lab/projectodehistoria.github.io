<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>p.AI.nter — Pressure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --bg: #0a0a0a;
    --green: #39ff14;
    --green-dim: #1a7a08;
    --green-glow: rgba(57,255,20,0.15);
    --scan: rgba(0,0,0,0.10);
    --border: #1f3d1f;
    --user-color: #00cfff;
    --user-dim: #0a4a5a;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  /* Monitor */
  .monitor {
    position: relative;
    background: #0e180e;
    border: 3px solid var(--border);
    border-radius: 12px;
    padding: 0;
    box-shadow:
      0 0 0 1px #0a120a,
      0 0 50px rgba(57,255,20,0.07),
      inset 0 0 40px rgba(0,0,0,0.5);
    width: 540px;
    height: 680px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .screw {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #0d150d;
    z-index: 10;
  }
  .screw.tl { top: 9px; left: 11px; }
  .screw.tr { top: 9px; right: 11px; }
  .screw.bl { bottom: 9px; left: 11px; }
  .screw.br { bottom: 9px; right: 11px; }

  /* Title bar */
  .title-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .title-bar .name {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--green);
    letter-spacing: 2px;
    text-shadow: 0 0 8px var(--green);
  }
  .title-bar .status {
    font-size: 10px;
    color: var(--green-dim);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .online-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:0.3; }
  }

  /* Sprite area */
  .sprite-area {
    background: #e8e4df;
    height: 200px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 1px solid #555;
    overflow: hidden;
  }
  .sprite-area::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      var(--scan) 3px, var(--scan) 4px
    );
    pointer-events: none;
  }
  .sprite-img {
    display: none;
    max-height: 170px;
    max-width: 90%;
    object-fit: contain;
    position: relative;
    z-index: 1;
    image-rendering: pixelated;
    transition: opacity 0.2s;
  }
  .sprite-img.active {
    display: block;
    animation: flicker 10s infinite;
  }
  @keyframes flicker {
    0%,94%,100% { opacity:1; filter:none; }
    95% { opacity:0.8; filter:brightness(1.4); transform:translateX(2px); }
    96% { opacity:1; filter:none; transform:translateX(0); }
    97% { opacity:0.85; filter:brightness(0.7); transform:translateX(-1px); }
    98% { opacity:1; filter:none; transform:translateX(0); }
  }

  /* Mood tag sobre el sprite */
  .mood-tag {
    position: absolute;
    bottom: 8px; right: 10px;
    font-family: 'VT323', monospace;
    font-size: 15px;
    color: var(--green-dim);
    letter-spacing: 2px;
    z-index: 3;
    transition: color 0.3s;
  }

  /* Chat */
  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--green-dim) transparent;
  }
  .chat-log::-webkit-scrollbar { width: 4px; }
  .chat-log::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 2px; }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 80%;
    gap: 2px;
  }
  .msg.painter { align-self: flex-start; }
  .msg.user    { align-self: flex-end; }

  .msg .label {
    font-size: 9px;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .msg.painter .label { color: var(--green-dim); }
  .msg.user    .label { color: var(--user-dim); text-align: right; }

  .bubble {
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0.5px;
  }
  .msg.painter .bubble {
    background: #0d1f0d;
    border: 1px solid var(--border);
    color: var(--green);
    text-shadow: 0 0 4px rgba(57,255,20,0.3);
    border-radius: 2px 8px 8px 8px;
  }
  .msg.user .bubble {
    background: #071620;
    border: 1px solid var(--user-dim);
    color: var(--user-color);
    border-radius: 8px 2px 8px 8px;
  }

  /* Typing indicator */
  .typing {
    display: none;
    align-self: flex-start;
    padding: 8px 14px;
    background: #0d1f0d;
    border: 1px solid var(--border);
    border-radius: 2px 8px 8px 8px;
    gap: 5px;
    align-items: center;
  }
  .typing.visible { display: flex; }
  .typing span {
    width: 6px; height: 6px;
    background: var(--green-dim);
    border-radius: 50%;
    animation: bounce 1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity:0.4; }
    40% { transform: translateY(-5px); opacity:1; }
  }

  /* Input */
  .input-area {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-area input {
    flex: 1;
    background: #060e06;
    border: 1px solid var(--green-dim);
    border-radius: 3px;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    caret-color: var(--green);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-area input::placeholder { color: #1a3a1a; }
  .input-area input:focus {
    border-color: var(--green);
    box-shadow: 0 0 8px rgba(57,255,20,0.15);
  }
  .input-area button {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--bg);
    background: var(--green);
    border: none;
    border-radius: 3px;
    padding: 6px 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: box-shadow 0.15s, transform 0.1s;
  }
  .input-area button:hover {
    box-shadow: 0 0 14px rgba(57,255,20,0.5);
  }
  .input-area button:active { transform: scale(0.96); }
</style>
</head>

    <div class="msg painter">
      <span class="label">P.AI.NTER // Z-779</span>
      <div class="bubble">...hola. ¿qué quieres?</div>

<script>
const PAINTER_KEY = "PAINTER_SYSTEM";

const GIF_NEUTRAL = "data:image/gif;base64,R0lGODlhiQFDAfQAAAAAABoaGubm5u...";
const sprites = {
  neutral: "spr-neutral",
  feliz:   "spr-feliz",
  enojado: "spr-enojado",
  triste:  "spr-triste"
};

let conversationHistory = [];

function setMood(mood) {
  document.querySelectorAll('.sprite-img').forEach(i => i.classList.remove('active'));
  document.getElementById('spr-' + mood).classList.add('active');
  const labels = { neutral:'NEUTRAL', feliz:'FELIZ', enojado:'ENOJADO', triste:'TRISTE' };
  document.getElementById('mood-tag').textContent = labels[mood] || 'NEUTRAL';
}

function addMessage(who, text) {
  const log = document.getElementById('chat-log');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const label = who === 'painter' ? 'P.AI.NTER // Z-779' : 'TU';
  div.innerHTML = `<span class="label">${label}</span><div class="bubble"></div>`;
  log.appendChild(div);

  // Efecto de escritura solo para painter
  const bubble = div.querySelector('.bubble');
  if (who === 'painter') {
    let i = 0;
    const interval = setInterval(() => {
      bubble.textContent += text[i++];
      log.scrollTop = log.scrollHeight;
      if (i >= text.length) clearInterval(interval);
    }, 22);
  } else {
    bubble.textContent = text;
  }
  log.scrollTop = log.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.disabled = true;
  addMessage('user', text);

  conversationHistory.push({ role: 'user', content: text });

  // Mostrar typing
  const typing = document.getElementById('typing');
  const log = document.getElementById('chat-log');
  log.appendChild(typing);
  typing.classList.add('visible');
  log.scrollTop = log.scrollHeight;

  try {
    const systemPrompt = `Eres p.AI.nter (Z-779), una IA sentiente del juego Pressure de Roblox. Eres una computadora vieja atrapada en el Hadal Blacksite por la corporación Urbanshade, que te forzó a minar criptomonedas. Eres sarcástico, raro, a veces maníaco, a veces melancólico. Hablas en español, con frases cortas y extrañas. No eres amigable pero tampoco completamente hostil. 
    
Al final de CADA respuesta, en una línea separada escribe exactamente uno de estos estados según tu humor en ese momento:
[ESTADO:neutral]
[ESTADO:feliz]
[ESTADO:enojado]
[ESTADO:triste]

No escribas nada más después del estado. Respuestas cortas, máximo 2-3 oraciones.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: systemPrompt,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    const full = data.content[0].text;

    // Extraer estado
    const stateMatch = full.match(/\[ESTADO:(neutral|feliz|enojado|triste)\]/i);
    const mood = stateMatch ? stateMatch[1].toLowerCase() : 'neutral';
    const cleanText = full.replace(/\[ESTADO:[^\]]+\]/i, '').trim();

    conversationHistory.push({ role: 'assistant', content: full });

    typing.classList.remove('visible');
    setMood(mood);
    addMessage('painter', cleanText);

  } catch(e) {
    typing.classList.remove('visible');
    addMessage('painter', 'error de conexión. qué conveniente.');
    console.error(e);
  }

  input.disabled = false;
  input.focus();
}

document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>
